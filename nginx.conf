server {
    listen 80;
    server_name localhost;
    
    # Increase client max body size to allow file uploads up to 10MB
    client_max_body_size 10M;
    
    # Default location for static files
    # HTML: no-cache so page updates appear immediately after a deploy.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Cacheable static assets: short TTL + revalidation so a redeploy of
    # JS/CSS/deck JSON propagates within minutes instead of hours.
    location ~* \.(?:js|mjs|css|json|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }
    
    # API endpoints - proxy to Python API server
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Handle file uploads
        client_max_body_size 10M;
    }
    
    # Error pages. The shared error page uses paths relative to /shared/, so it
    # must be served at that exact URI (there is no root 404.html/50x.html).
    error_page 404 /shared/error.html;
    error_page 500 502 503 504 /shared/error.html;
}
